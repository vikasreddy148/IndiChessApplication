spring.application.name=IndiChessBackend-test

# Use in-memory DB for tests so `mvn test` doesn't require a running local MySQL
spring.datasource.url=jdbc:h2:mem:indichessdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


